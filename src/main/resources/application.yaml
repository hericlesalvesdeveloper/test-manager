spring:
  application:
    name: TestManager

  datasource:
    url: ${DATABASE_URL}
    username: ${USER}
    password: ${PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    baseline-on-migrate: true


